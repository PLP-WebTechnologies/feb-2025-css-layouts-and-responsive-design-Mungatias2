<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Webpage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #2d89ef;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    nav {
      background-color: #444;
      color: white;
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0.5rem;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
    }

    .container {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 20px;
      padding: 20px;
    }

    .main-content {
      background-color: #f4f4f4;
      padding: 1rem;
    }

    .sidebar {
      background-color: #eee;
      padding: 1rem;
    }

    footer {
      text-align: center;
      background-color: #2d89ef;
      color: white;
      padding: 1rem;
      margin-top: 20px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }

      nav {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>My Responsive Webpage</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <div class="main-content">
      <h2>Main Content</h2>
      <p>This section adapts based on the screen size using CSS Grid and media queries. Resize the browser to see it in action!</p>
    </div>

    <div class="sidebar">
      <h3>Sidebar</h3>
      <p>This sidebar moves below the content on smaller screens.</p>
    </div>
  </div>

  <footer>
    <p>Made with love and Flexbox + Grid</p>
  </footer>

</body>
</html>
